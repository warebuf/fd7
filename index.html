<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>fd7</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="shared.css">
<style>
  .battlefield{
    flex:1 1 auto; min-height:0; width:100%; max-width:1300px; margin:0 auto; padding:10px 14px;
    display:grid; grid-template-columns:1fr minmax(240px, 300px) 1fr; gap:12px;
  }
  .panel{
    background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px 12px;
    display:flex; flex-direction:column; gap:10px; min-height:0; border-top:3px solid var(--side);
  }
  .panel.p1{ --side:var(--p1); --side-bg:var(--p1-bg); }
  .panel.p2{ --side:var(--p2); --side-bg:var(--p2-bg); }
  .panel-head{ display:flex; align-items:center; gap:8px; }
  .panel-title{ font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:.95rem; color:var(--side); flex:1 1 auto; }
  .row-label{ font-size:.6rem; text-transform:uppercase; letter-spacing:.07em; color:var(--text-dim); margin-bottom:4px; }
  .row{ display:flex; flex-wrap:wrap; gap:8px; }
  .slot-names{ display:flex; gap:8px; }
  .slot-names .row-label{ width:92px; text-align:center; }
  /* each board is centered in its panel; the left one is mirrored (Back · Middle · Front) so the front lines face */
  .slot-names, .units-row{ justify-content:center; }
  .deck-section{ flex:1 1 auto; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:10px; }
  .deck-list{ display:flex; flex-direction:column; gap:3px; }
  /* deck rows are a small table: position, icon, name, then one aligned column per stat */
  .deck-row, .deck-cols{
    display:grid; grid-template-columns:18px 18px minmax(0,1fr) repeat(7, 32px); align-items:center; column-gap:4px;
    padding:3px 8px; font-size:.74rem;
  }
  .deck-row{ border-radius:6px; background:var(--panel-2); border-left:3px solid var(--role); }
  .deck-cols{ padding-top:0; padding-bottom:2px; border-left:3px solid transparent; font-size:.58rem; letter-spacing:.05em; color:var(--text-dim); }
  .deck-cols span, .deck-row .num{ text-align:right; }
  .deck-row .nm{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .deck-row .nm small{ color:var(--side); font-size:.6rem; font-weight:600; margin-left:5px; letter-spacing:.04em; }
  .deck-row .num{ font-size:.68rem; }
  .deck-row.benched{ opacity:.55; }
  .structures{ display:flex; flex-direction:column; gap:4px; }
  .structures .row-label b{ color:var(--text); font-size:.7rem; }
  .con-pending{ text-transform:none; letter-spacing:0; }
  .structure-row{ display:flex; flex-wrap:wrap; gap:5px; align-items:center; }
  .structure-pill{ font-size:.7rem; border-color:var(--support); color:var(--support); font-weight:600; }
  .structure-btn{ border-color:var(--support); color:var(--support); }
  .structure-btn.picking, .structure-btn.ready{ background:var(--support); color:var(--bg); }
  .deck-row .num.zero{ color:var(--text-dim); opacity:.5; }
  .deck-row .num.key{ color:var(--role); font-weight:600; }
  .deck-row.r-attacker{ --role:var(--danger); }
  .deck-row.r-healer{ --role:var(--heal); }
  .deck-row.r-support{ --role:var(--support); }
  .deck-row .pos{ color:var(--text-dim); font-size:.66rem; }

  /* card tiles, used for board units and empty slots */
  .tile{
    position:relative; width:92px; min-height:118px; border-radius:10px; border:1px solid var(--line);
    background:var(--panel-2); padding:7px 6px 6px; display:flex; flex-direction:column; align-items:center; gap:3px;
    border-top:3px solid var(--role); cursor:pointer; user-select:none;
  }
  .tile.r-attacker{ --role:var(--danger); }
  .tile.r-healer{ --role:var(--heal); }
  .tile.r-support{ --role:var(--support); }
  .prio{
    position:absolute; top:3px; left:4px; font-size:.58rem; font-weight:600; color:var(--text-dim);
    border:1px solid var(--line); border-radius:999px; min-width:15px; padding:0 3px; text-align:center; background:var(--panel);
  }
  .line.buff{ color:var(--support); }
  .ability-btn{
    font-family:inherit; font-size:.62rem; font-weight:700; letter-spacing:.03em; color:var(--role); cursor:pointer;
    background:var(--panel); border:1px solid var(--role); border-radius:999px; padding:1px 7px; line-height:1.4;
  }
  .ability-btn:hover{ background:var(--side-bg); }
  .tile .line.status{ font-size:.55rem; font-weight:600; letter-spacing:.03em; color:var(--danger); text-align:center; line-height:1.2; }
  .tile .icon{ font-size:1.4rem; line-height:1.1; }
  .tile .name{ font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:.76rem; text-align:center; line-height:1.1; }
  .tile .line{ font-size:.64rem; color:var(--text-dim); }
  .tile .line.hot{ color:var(--role); font-weight:600; }
  .tile.next{ box-shadow:0 0 0 2px var(--side); }
  .tile.targetable{ outline:2px dashed var(--support); outline-offset:3px; cursor:crosshair; }
  .next-tag{
    position:absolute; top:-8px; left:50%; transform:translateX(-50%); font-family:'Chakra Petch',sans-serif;
    font-weight:700; font-size:.55rem; letter-spacing:.08em; padding:0 6px; border-radius:999px; background:var(--side); color:var(--bg);
  }
  .bar{ width:100%; height:4px; border-radius:999px; background:var(--line); overflow:hidden; margin-top:auto; }
  .bar + .bar{ margin-top:2px; }
  .bar > div{ height:100%; }
  .bar.hp > div{ background:var(--heal); }
  .bar.hp.low > div{ background:var(--danger); }
  .bar.cd > div{ background:var(--side); opacity:.6; }
  .bar.cd.full > div{ opacity:1; }
  .round-progress{ width:90px; height:5px; border-radius:999px; background:var(--line); overflow:hidden; }
  .round-progress > div{ height:100%; width:0; background:var(--text-dim); }
  /* battle animations (see playEvents): a bolt flies from attacker to target, numbers float off the units */
  .bolt{
    position:fixed; left:0; top:0; width:10px; height:10px; margin:-5px 0 0 -5px; border-radius:50%;
    background:var(--bolt); box-shadow:0 0 10px 2px var(--bolt); pointer-events:none; z-index:30;
  }
  .float-text{
    position:absolute; left:50%; top:38%; transform:translateX(-50%); pointer-events:none; z-index:5; white-space:nowrap;
    font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:.95rem; text-shadow:0 1px 2px var(--panel);
  }
  .float-text.dmg{ color:var(--danger); }
  .float-text.heal{ color:var(--heal); }
  .float-text.buff{ color:var(--support); font-size:.8rem; }
  .float-text.debuff{ color:var(--text-dim); font-size:.8rem; }

  /* the action spotlight: what the last pause is showing */
  .action-panel{
    flex:0 0 auto; background:var(--panel); border:1px solid var(--line); border-left:4px solid var(--side, var(--line));
    border-radius:12px; padding:8px 10px; display:flex; flex-direction:column; gap:4px; min-height:78px;
  }
  .action-panel.p1{ --side:var(--p1); } .action-panel.p2{ --side:var(--p2); }
  .action-title{ font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:.9rem; color:var(--side, var(--text)); }
  .action-line{ font-size:.74rem; line-height:1.35; }
  .action-line.attack{ color:var(--danger); } .action-line.heal{ color:var(--heal); }
  .action-line.destroy, .action-line.win{ font-weight:700; }
  .action-line.meta, .action-line.idle{ color:var(--text-dim); }
  .action-wait{ font-size:.74rem; color:var(--text-dim); font-style:italic; }
  .slot-empty{
    position:relative; width:92px; min-height:118px; border-radius:10px; border:1px dashed var(--line); color:var(--text-dim);
    display:flex; align-items:center; justify-content:center; font-size:1.3rem;
  }
  .empty-note{ font-size:.72rem; color:var(--text-dim); font-style:italic; }

  .center-col{ display:flex; flex-direction:column; gap:10px; min-height:0; }
  .log-panel{
    flex:1 1 auto; min-height:120px; background:var(--panel); border:1px solid var(--line); border-radius:12px;
    display:flex; flex-direction:column; overflow:hidden;
  }
  .log-head{ padding:7px 10px; font-size:.66rem; text-transform:uppercase; letter-spacing:.07em; color:var(--text-dim); border-bottom:1px solid var(--line); }
  .log-body{ flex:1 1 auto; overflow-y:auto; padding:6px 10px; font-size:.7rem; line-height:1.4; }
  .log-line.attack{ color:var(--danger); }
  .log-line.heal{ color:var(--heal); }
  .log-line.destroy{ font-weight:600; }
  .log-line.win{ font-weight:700; color:var(--text); }
  .log-line.idle, .log-line.meta{ color:var(--text-dim); }

  @media (max-width:900px){
    .battlefield{ grid-template-columns:1fr; }
    .center-col{ order:3; }
    .log-panel{ max-height:260px; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">fd7</div>
    <span class="pill">Round <b id="roundLabel">1</b></span>
    <span class="pill mono" title="Rounds won">P1 <b id="scoreLabel">0 – 0</b> P2</span>
    <span class="pill" id="phasePill"><b id="phaseLabel">Setup</b></span>
    <span class="pill mono" id="tickPill" hidden>Tick <b id="tickLabel">0</b>/<span id="tickMax"></span></span>
    <div class="round-progress" id="roundProgress" hidden title="Round clock"><div id="roundFill"></div></div>
    <span class="pill" id="nextPill" hidden>Next: <b id="nextLabel"></b></span>
    <span class="spacer"></span>
    <button class="btn primary" id="mainBtn">Start battle</button>
    <a class="btn ghost small" href="decks.html">Decks</a>
    <button class="btn ghost small" id="resetBtn">New game</button>
  </div>
</header>

<main class="battlefield">
  <section class="panel p1" id="panel-0"></section>
  <div class="center-col">
    <div class="action-panel" id="actionPanel" aria-live="polite">
      <div class="inspector-head">Action</div>
      <div id="actionBody"></div>
    </div>
    <div class="inspector" id="inspector">
      <div class="inspector-head">Card Info</div>
      <div id="inspectorBody"></div>
    </div>
    <div class="log-panel">
      <div class="log-head">Battle Log</div>
      <div class="log-body" id="logBody"></div>
    </div>
  </div>
  <section class="panel p2" id="panel-1"></section>
</main>

<script src="shared.js"></script>
<script>
(function(){
  var UNIT_SLOTS = SLOT_NAMES.length, SIM_TICKS = 120;   // ticks per round
  var state;
  var cardUid = 0;

  // ---------- Setup of a game ----------
  function makeCard(key){
    var c = { uid: 'c' + (cardUid++) };
    var def = CARD_DEFS[key];
    for (var k in def) c[k] = def[k];
    return c;
  }
  function shuffle(arr){
    for (var i = arr.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
    return arr;
  }
  function buildDeck(recipe){
    var deck = [];
    Object.keys(recipe).forEach(function(k){ for (var i = 0; i < recipe[k]; i++) deck.push(makeCard(k)); });
    return shuffle(deck);
  }
  // Each player has a shuffled 12-card deck.
  function newPlayer(name, recipe){
    return { name: name, deck: buildDeck(recipe), hand: [], discard: [], con: 0, structures: [], units: new Array(UNIT_SLOTS).fill(null) };
  }
  function newGame(){
    stopClock();
    var recipes = loadDeckRecipes();
    state = {
      round: 1, phase: 'setup', tick: 0, roundWins: [0, 0], log: [], logSeq: 0, queue: [],
      fx: newFx(),      // animations recorded this tick, played after the board redraws
      spotlight: null,  // { title, side, fromSeq } — the action panel shows log lines from fromSeq on
      inspected: null,  // { card, side, slot } — slot set when it is a unit on the board
      players: [newPlayer('Player 1', recipes[0]), newPlayer('Player 2', recipes[1])]
    };
    addLog('Round 1: each player draws ' + HAND_SIZE + ' and ' + UNIT_SLOTS + ' are placed, preferred positions first. Switch abilities if you like, then start the battle.', 'meta');
    dealUnits();
    logTurnOrder();
    render();
  }

  function addLog(text, type){
    state.log.push({ text: text, type: type || 'meta', seq: state.logSeq++ });
    if (state.log.length > 300) state.log.shift();
  }

  // ---------- Setup phase: draw, then place by preference ----------
  // Each round a player draws HAND_SIZE cards (the discard pile is shuffled back in first if the deck is too thin).
  // Then the board fills in two passes: first, each slot (front to back) takes a drawn card that prefers its line;
  // then any slot still empty takes whatever is left. Ties between cards are broken at random. The rest sit on
  // the bench this round.
  function drawHand(p){
    if (p.deck.length < HAND_SIZE && p.discard.length){
      p.deck = shuffle(p.deck.concat(p.discard));
      p.discard = [];
      addLog(p.name + ' is running low — the discard pile is shuffled back into the deck.', 'meta');
    }
    p.hand = p.deck.splice(0, HAND_SIZE);
  }
  function autoPlace(p){
    var left = shuffle(p.hand.slice());
    p.units = new Array(UNIT_SLOTS).fill(null);
    SLOT_LINES.forEach(function(line, slot){
      var at = left.findIndex(function(c){ return c.prefers === line; });
      if (at !== -1) p.units[slot] = newUnit(left.splice(at, 1)[0], slot);
    });
    SLOT_LINES.forEach(function(line, slot){
      if (!p.units[slot] && left.length) p.units[slot] = newUnit(left.shift(), slot);
    });
  }
  function onBoard(p, card){ return p.units.some(function(u){ return u && u.card === card; }); }
  function dealUnits(){
    state.players.forEach(function(p){ drawHand(p); autoPlace(p); });
  }
  function onSlotClick(side, slot){
    var u = state.players[side].units[slot];
    if (!u) return;
    if (state.targeting && state.targeting.side === side) return activateStructure(side, state.targeting.index, slot);
    state.inspected = { card: u.card, side: side, slot: slot };
    render();
  }
  // A placed unit starts with the ability its card used last time if it is usable from this slot, otherwise
  // its first ability that is. With none usable from this slot (e.g. a Predator out of the back), ability is
  // null: the unit just stands there and never acts.
  function newUnit(card, slot){
    var hp = card.hp + (card.bonusHp || 0);
    var last = findAbility(card, card.lastAbility);
    var usable = abilityAllowed(last, slot) ? last : allowedAbilities(card, slot)[0];
    return { card: card, hp: hp, maxHp: hp, ability: usable ? usable.id : null };
  }
  // Abilities can be switched during setup and during the battle. Switching mid-battle pauses the sim (if it is
  // running) and resets that unit's charge: its next action is a full cooldown away.
  function canSwitchAbility(){ return state.phase === 'setup' || state.phase === 'battle'; }
  // Returns true if the unit now uses that ability.
  function setAbility(side, slot, id){
    var u = state.players[side].units[slot];
    if (!canSwitchAbility() || !u || !abilityAllowed(findAbility(u.card, id), slot)) return false;
    if (state.phase === 'battle' && clock){ stopClock(); addLog('t' + state.tick + ': battle paused to switch an ability.', 'meta'); }
    var next = findAbility(u.card, id).id;
    if (state.phase === 'battle' && next !== u.ability){
      u.delay = state.tick;   // the schedule restarts from now, so the charge bar empties
      u.delayed = 0;
      state.queue = state.queue.filter(function(q){ return !(q.side === side && q.slot === slot); });
      addLog('t' + state.tick + ': ' + state.players[side].name + ' switches ' + u.card.name + ' to ' + findAbility(u.card, next).name +
        ' — its charge resets.', 'meta');
    }
    u.ability = next;
    u.card.lastAbility = u.ability;
    state.inspected = { card: u.card, side: side, slot: slot };
    render();
    return true;
  }
  function cycleAbility(side, slot){
    var u = state.players[side].units[slot], list = allowedAbilities(u.card, slot);
    if (!list.length) return;
    var i = list.indexOf(findAbility(u.card, u.ability));
    for (var step = 1; step < list.length; step++){
      if (setAbility(side, slot, list[(i + step) % list.length].id)) return;
    }
  }

  // ---------- Battle ----------
  function startBattle(){
    if (state.phase !== 'setup') return;
    state.phase = 'battle';
    state.tick = 0;
    state.queue = [];
    state.fielded = [].concat.apply([], state.players.map(function(p){ return p.units.filter(Boolean).map(function(u){ return u.card; }); }));
    state.spotlight = { title: 'Battle begins', fromSeq: state.logSeq };
    addLog('Round ' + state.round + ': battle begins.', 'meta');
    if (!checkForWipe()) startClock();   // a side that fielded no units loses on the spot
  }

  // Turn order: the board slots are numbered 1–8 and lower numbers act first when units act on the same tick.
  // One side's slots are 1, 3, 5, 7 (front to back), the other's 2, 4, 6, 8, and the sides swap every round.
  function oddSide(){ return (state.round - 1) % 2; }
  function priority(side, slot){ return 2 * slot + (side === oddSide() ? 1 : 2); }
  function logTurnOrder(){
    var nums = function(side){ return SLOT_NAMES.map(function(_, slot){ return '#' + priority(side, slot); }).join(', '); };
    addLog('Turn order: ' + state.players[oddSide()].name + ' acts ' + nums(oddSide()) + ' and ' + state.players[1 - oddSide()].name + ' ' + nums(1 - oddSide()) + ' on shared ticks.', 'meta');
  }
  // A unit acts every `cd` ticks. Each Saboteur delay pushes that whole schedule back (u.delay ticks in total).
  function isDue(u, t, cd){ var e = t - (u.delay || 0); return e > 0 && e % cd === 0; }
  function chargeAt(u, t, cd){ var e = t - (u.delay || 0); return e <= 0 ? 0 : (e % cd) / cd; }
  // The charge to show for the unit in this slot: full while it is still waiting its turn on the current tick
  // (actions play one at a time, so others on the same tick may go first), otherwise from its schedule.
  function chargeShown(side, slot, t){
    var u = state.players[side].units[slot], cd = cooldownOf(side, slot);
    if (!isFinite(cd)) return 0;
    if (state.queue.some(function(q){ return q.side === side && q.slot === slot; })) return 1;
    return chargeAt(u, t, cd);
  }
  // The tick of u's next action: now, if it is still queued on this tick.
  function nextActionTick(side, slot, u, cd){
    if (state.queue.some(function(q){ return q.side === side && q.slot === slot; })) return state.tick;
    var e = state.tick - (u.delay || 0);
    return (u.delay || 0) + (e <= 0 ? 1 : Math.floor(e / cd) + 1) * cd;
  }
  function actorsAt(t){
    var order = [];
    [0, 1].forEach(function(side){
      state.players[side].units.forEach(function(u, slot){
        var cd = u ? cooldownOf(side, slot) : Infinity;
        if (isFinite(cd) && isDue(u, t, cd)) order.push({ side: side, slot: slot, tick: t, prio: priority(side, slot) });
      });
    });
    return order.sort(function(a, b){ return a.prio - b.prio; });
  }

  // ---------- Effective stats (base stats plus this round's buffs) ----------
  function armorOf(side, slot){
    var u = state.players[side].units[slot];
    return Math.max(0, u.card.armor + (u.card.bonusArmor || 0));
  }
  function mrOf(side, slot){
    var u = state.players[side].units[slot];
    return Math.max(0, u.card.mr + (u.card.bonusMr || 0));
  }
  function cooldownOf(side, slot){
    var u = state.players[side].units[slot];
    if (!u.ability || findAbility(u.card, u.ability).passive) return Infinity;   // no usable or only a passive ability: never acts
    var as = u.card.as;
    return as > 0 ? Math.round(TICKS_PER_SECOND / as) : Infinity;
  }

  function peekNextAction(){
    if (state.phase !== 'battle') return null;
    // queued actors killed earlier this tick have left their slot empty and will be skipped
    for (var i = 0; i < state.queue.length; i++){
      var a = state.queue[i];
      if (state.players[a.side].units[a.slot]) return a;
    }
    for (var t = state.tick + 1; t <= SIM_TICKS; t++){
      var q = actorsAt(t);
      if (q.length) return q[0];
    }
    return null;
  }

  // Resolves the next queued action on the current tick and spotlights it. Queued units killed earlier this
  // tick have left their slot empty and are skipped. Returns false if nothing was left on this tick.
  // Resolves the next queued action on the current tick. Queued units killed earlier this tick have left their
  // slot empty and are skipped. Returns false if nothing was left on this tick. The caller renders.
  function resolveNext(){
    while (state.queue.length){
      var a = state.queue.shift();
      var u = state.players[a.side].units[a.slot];
      if (!u) continue;
      var start = state.fx.cursor;
      state.fx.impact = null;
      state.fx.events.push({ type: 'act', side: a.side, slot: a.slot, at: start });
      act(a.side, a.slot, u);
      if (state.fx.cursor === start) state.fx.cursor += FX_STEP;   // no attack: still give the next action its own beat
      checkForWipe();
      return true;
    }
    return false;
  }
  function clearFx(){ state.fx = newFx(); }
  function timeUp(){
    state.spotlight = { title: 'Time is up', fromSeq: state.logSeq };
    endRound(null, 'time ran out with units standing on both sides');
  }

  // ---------- The clock ----------
  // The battle sims on its own: the clock advances TICK_MS per tick and charge bars fill smoothly. When units
  // act, each action resolves on its own, the board redraws and animates it, and the clock holds for
  // ACTION_HOLD_MS before the next one. Pause/Resume stops and restarts it at any time, and switching an
  // ability mid-battle pauses it.
  var TICK_MS = 100;           // real time per tick: how fast charge bars fill
  var ACTION_HOLD_MS = 1000;   // how long the sim pauses after each action, so it can be read
  var clock = null;   // { frac, last, raf } while simming

  function togglePause(){
    if (state.phase !== 'battle') return;
    if (clock){ stopClock(); render(); }
    else startClock();
  }
  function startClock(){
    clearFx();
    clock = { frac: 0, last: performance.now() };
    render();
    clock.raf = requestAnimationFrame(frame);
  }
  function stopClock(){
    if (clock && clock.raf) cancelAnimationFrame(clock.raf);
    clock = null;
  }
  // ---------- Battle animations ----------
  // While a tick resolves, effects are recorded as timed events (fx.events); after the board redraws they play in
  // order: the attacker lunges toward the enemy, a bolt flies to its target, and when it lands the target flashes
  // and a number floats off it (−damage, +heal, buffs). Actions on one tick play FX_STEP ms apart.
  var FX_STEP = 220, FX_FLIGHT = 280;
  var reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  function newFx(){ return { events: [], cursor: 0, impact: null }; }
  function fxAttack(side, slot, toSide, toSlot){
    var at = state.fx.cursor;
    state.fx.events.push({ type: 'attack', side: side, slot: slot, toSide: toSide, toSlot: toSlot, at: at });
    state.fx.cursor += FX_STEP;
    state.fx.impact = at + FX_FLIGHT;
  }
  // a floating label on a unit: at the moment the current attack lands, or right away for non-attacks
  function fxFloat(side, slot, text, kind){
    state.fx.events.push({ type: 'float', side: side, slot: slot, text: text, kind: kind,
      at: state.fx.impact != null ? state.fx.impact : state.fx.cursor });
  }
  function unitEl(side, slot){ return document.querySelector('[data-unit="' + side + '-' + slot + '"]'); }
  function playEvents(){
    if (!document.body) return;
    state.fx.events.forEach(function(e){
      var at = unitEl(e.side, e.slot);
      if (!at || !at.animate) return;
      var toward = e.side === 0 ? 1 : -1;   // the left player's units face right, the right player's face left
      if (e.type === 'act' && !reduceMotion){
        at.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.06)' }, { transform: 'scale(1)' }], { duration: 260, delay: e.at });
      }
      if (e.type === 'attack'){
        var to = unitEl(e.toSide, e.toSlot);
        if (!to || reduceMotion) return;
        at.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(' + (14 * toward) + 'px)' }, { transform: 'translateX(0)' }],
          { duration: 300, delay: e.at, easing: 'ease-out' });
        var a = at.getBoundingClientRect(), b = to.getBoundingClientRect();
        var bolt = document.body.appendChild(el('div', 'bolt', {}));
        if (!bolt.animate) return;
        bolt.style.setProperty('--bolt', e.side === 0 ? 'var(--p1)' : 'var(--p2)');
        var x1 = a.left + a.width / 2, y1 = a.top + a.height / 2, x2 = b.left + b.width / 2, y2 = b.top + b.height / 2;
        bolt.animate([{ transform: 'translate(' + x1 + 'px,' + y1 + 'px)', opacity: 1 }, { transform: 'translate(' + x2 + 'px,' + y2 + 'px)', opacity: 1 }],
          { duration: FX_FLIGHT, delay: e.at, easing: 'ease-in', fill: 'both' }).onfinish = function(){ bolt.remove(); };
      }
      if (e.type === 'float'){
        var label = at.appendChild(el('div', 'float-text ' + e.kind, {}));
        label.textContent = e.text;
        label.animate([{ opacity: 0, transform: 'translate(-50%, 6px)' }, { opacity: 1, transform: 'translate(-50%, -8px)', offset: .2 },
                       { opacity: 0, transform: 'translate(-50%, -34px)' }], { duration: 1100, delay: e.at, easing: 'ease-out', fill: 'both' })
          .onfinish = function(){ label.remove(); };
        if (e.kind === 'dmg' && !reduceMotion){
          at.animate([{ transform: 'translateX(0)', filter: 'none' }, { transform: 'translateX(-4px)', filter: 'brightness(1.6)' },
                      { transform: 'translateX(4px)' }, { transform: 'translateX(0)', filter: 'none' }], { duration: 320, delay: e.at });
        }
      }
    });
  }

  // Resolves the next action due on the current tick on its own: its own spotlight, board redraw and
  // animations. Returns false if nothing is left to act on this tick.
  function resolveOne(){
    while (state.queue.length){
      var a = state.queue[0], u = state.players[a.side].units[a.slot];
      if (!u){ state.queue.shift(); continue; }   // killed earlier this tick
      clearFx();
      state.spotlight = { title: 't' + state.tick + ' · ' + state.players[a.side].name + "'s " + u.card.name, side: a.side, fromSeq: state.logSeq };
      return resolveNext();
    }
    return false;
  }
  // Actions play strictly one at a time. Each one is followed by a hold (at least ACTION_HOLD_MS, longer if its
  // animation needs it); the next action due on the same tick goes next, and only then does the clock move on.
  function frame(now){
    var c = clock;
    if (!c) return;
    c.frac += (now - c.last) / TICK_MS;
    c.last = now;
    while (c.frac >= 1){
      c.frac -= 1;
      if (!state.queue.length){
        if (state.tick >= SIM_TICKS){ stopClock(); timeUp(); return; }
        state.tick++;
        state.queue = actorsAt(state.tick);
      }
      if (resolveOne()){
        if (state.phase !== 'battle'){ playEvents(); return; }   // the round ended (endRound stopped the clock and rendered)
        c.frac = Math.min(c.frac, 0) - Math.max(ACTION_HOLD_MS, state.fx.cursor + FX_FLIGHT + 500) / TICK_MS;
        render();
        playEvents();
        break;
      }
    }
    paintClock(state.tick + Math.max(0, c.frac));
    c.raf = requestAnimationFrame(frame);
  }
  // Updates just the moving parts (charge bars, tick counter, round clock) for a fractional tick t,
  // without rebuilding the board.
  function paintClock(t){
    document.querySelectorAll('[data-charge]').forEach(function(fill){
      var parts = fill.getAttribute('data-charge').split('-');
      var side = +parts[0], slot = +parts[1];
      if (!state.players[side].units[slot]) return;
      var pct = chargeShown(side, slot, t);
      fill.style.width = (pct * 100) + '%';
      fill.parentNode.classList.toggle('full', pct > .85);
    });
    document.getElementById('tickLabel').textContent = Math.floor(t);
    document.getElementById('roundFill').style.width = (Math.min(t, SIM_TICKS) / SIM_TICKS * 100) + '%';
  }

  // ---------- Actions ----------
  // Every unit uses the one ability its owner chose for it this round — see ABILITIES.
  var MEDIC_AD_BUFF = 3, HEAVY_MULT = 1.5, FLANK_MULT = 0.5, TROPHY_AD = 2, SABOTAGE_DELAY = 5;

  // Permanent bonuses earned in play live on the card itself, so they follow it through the deck.
  // permanent bonuses live on the card
  // permanent bonuses live on the card; roundAd lasts only for this round (Blood Engine)
  function adOf(u){ return u.card.ad + (u.card.bonusAd || 0) + (u.roundAd || 0); }
  function apOf(u){ return u.card.ap + (u.card.bonusAp || 0); }

  function act(side, slot, u){
    u.delayed = 0;
    // jammed by a Saboteur's Jam: this turn's ability does nothing, but the turn (and its charge) is spent
    if (u.jammed){
      u.jammed = false;
      fxFloat(side, slot, 'JAMMED', 'debuff');
      return say(side, u, 'is jammed — its ' + findAbility(u.card, u.ability).name + ' does nothing this turn.', 'meta');
    }
    return ABILITIES[u.ability](side, slot, u);
  }
  // The enemy (on dSide) that will act soonest, ties broken by turn order; skip(unit) can rule units out.
  // Returns its slot, or -1 if no enemy will act.
  function nextEnemyToAct(dSide, skip){
    var dp = state.players[dSide], best = -1, bestAt = Infinity, bestPrio = Infinity;
    dp.units.forEach(function(e, i){
      if (!e || (skip && skip(e))) return;
      var cd = cooldownOf(dSide, i);
      if (!isFinite(cd)) return;
      var at = nextActionTick(dSide, i, e, cd), prio = priority(dSide, i);
      if (at < bestAt || (at === bestAt && prio < bestPrio)){ best = i; bestAt = at; bestPrio = prio; }
    });
    return best;
  }

  // Every unit on the side (the buffer included) permanently gains `amount` of a stat, stored on its card. Stacks.
  function buffTeam(side, u, field, amount, statName){
    state.players[side].units.forEach(function(a, i){ if (a){ a.card[field] = (a.card[field] || 0) + amount; fxFloat(side, i, '+' + amount + ' ' + statName, 'buff'); } });
    say(side, u, 'rallies the team: +' + amount + ' ' + statName + ' for the rest of the game to every unit on its side.', 'heal');
  }

  function say(side, u, text, type){
    addLog('t' + state.tick + ': ' + state.players[side].name + "'s " + u.card.name + ' ' + text, type || 'meta');
  }

  // Every ability by id (see each card's `abilities`). Each runs as function(side, slot, u).
  var ABILITIES = {
    // Striker · Heavy attack on a random enemy
    heavy: function(side, slot, u){
        var dp = state.players[1 - side];
        var alive = dp.units.map(function(e, i){ return e ? i : -1; }).filter(function(i){ return i !== -1; });
        if (!alive.length) return;
        var pick = alive[Math.floor(Math.random() * alive.length)];
        strike(side, slot, u, 1 - side, chooseTarget(dp, pick), Math.round(adOf(u) * HEAVY_MULT), 'physical', { what: 'heavy attack' });
      },
    // Striker · Execute: hit the most damaged enemy (lowest HP %) for its AD; the front line if nobody is damaged yet
    execute: function(side, slot, u){
        var dp = state.players[1 - side], best = -1, bestPct = 1;
        dp.units.forEach(function(e, i){ if (e && e.hp < e.maxHp && e.hp / e.maxHp < bestPct){ bestPct = e.hp / e.maxHp; best = i; } });
        if (best === -1) return frontStrike(side, slot, u, adOf(u));
        strike(side, slot, u, 1 - side, chooseTarget(dp, best), adOf(u), 'physical', { what: 'execute' });
      },
    // Medic · Heal the weakest ally (by HP %) for its AP
    heal: function(side, slot, u){ healWeakest(side, u, apOf(u)); },
    // Medic · AD buff for the whole side
    adbuff: function(side, slot, u){ buffTeam(side, u, 'bonusAd', MEDIC_AD_BUFF, 'AD'); },
    // Predator · Trophy: attack the frontmost enemy; every kill permanently grows this card
    trophy: function(side, slot, u){
        frontStrike(side, slot, u, adOf(u), '', function(){
          u.card.bonusAd = (u.card.bonusAd || 0) + TROPHY_AD;
          say(side, u, 'claims a trophy: +' + TROPHY_AD + ' AD for the rest of the game (now ' + adOf(u) + ').', 'heal');
        });
      },
    // Predator · Flank: hit the backmost enemy (back slot, else middle, else front) for FLANK_MULT of its AD
    flank: function(side, slot, u){
        var dp = state.players[1 - side], back = -1;
        dp.units.forEach(function(e, i){ if (e) back = i; });
        if (back === -1) return;
        strike(side, slot, u, 1 - side, chooseTarget(dp, back), Math.round(adOf(u) * FLANK_MULT), 'physical', { what: 'flank' });
      },
    // Saboteur · Sabotage: push back the next enemy action
    sabotage: function(side, slot, u){
        var dSide = 1 - side, dp = state.players[dSide], best = nextEnemyToAct(dSide);
        if (best === -1){ say(side, u, 'has no enemy action to delay.', 'idle'); return; }
        var target = dp.units[best];
        state.queue = state.queue.filter(function(q){ return !(q.side === dSide && q.slot === best); });
        target.delay = (target.delay || 0) + SABOTAGE_DELAY;
        target.delayed = (target.delayed || 0) + SABOTAGE_DELAY;
        fxAttack(side, slot, dSide, best);
        fxFloat(dSide, best, '+' + SABOTAGE_DELAY + ' ticks', 'debuff');
        say(side, u, 'sabotages ' + dp.name + "'s " + target.card.name + ': its next action slips ' + SABOTAGE_DELAY +
          ' ticks, to t' + nextActionTick(dSide, best, target, cooldownOf(dSide, best)) + '.', 'attack');
      },
    // Saboteur · Jam: the next enemy to act (that isn't already jammed) skips its ability effect that turn; its
    // charge still resets normally, so the turn is simply wasted
    jam: function(side, slot, u){
        var dSide = 1 - side, dp = state.players[dSide];
        var target = nextEnemyToAct(dSide, function(e){ return e.jammed; });
        if (target === -1){ say(side, u, 'has no enemy action to jam.', 'idle'); return; }
        dp.units[target].jammed = true;
        fxAttack(side, slot, dSide, target);
        fxFloat(dSide, target, 'JAMMED', 'debuff');
        say(side, u, 'jams ' + dp.name + "'s " + dp.units[target].card.name + ': its next ability does nothing.', 'attack');
      },
    // Warden · Taunt is passive (never acted out) — see chooseTarget
    taunt: function(){},
    // Any unit · No action (passive: never acted out)
    none: function(){},
    // Any unit · Construct: add its CON to the construction pool
    construct: function(side, slot, u){
      var p = state.players[side];
      p.con += u.card.con || 0;
      fxFloat(side, slot, '+' + (u.card.con || 0) + ' CON', 'buff');
      say(side, u, 'constructs: +' + (u.card.con || 0) + ' construction (' + p.name + ' now has ' + p.con + ').', 'heal');
    }
  };

  // Who does an attack on dp hit? The frontmost unit (front slot, else middle, else back) by default, or a
  // specific slot.
  // A living taunter (Warden) overrides both: every enemy attack must target it.
  function chooseTarget(dp, prefer){
    var natural = (typeof prefer === 'number' && dp.units[prefer]) ? prefer : dp.units.findIndex(Boolean);
    if (natural === -1) return null;
    var taunter = dp.units.findIndex(function(e){ return e && e.ability === 'taunt'; });
    if (taunter !== -1) return { slot: taunter, taunted: taunter !== natural };   // taunted: pulled off its natural target
    return { slot: natural };
  }

  function frontStrike(side, slot, u, amount, what, onKill){
    var target = chooseTarget(state.players[1 - side], null);
    if (target) strike(side, slot, u, 1 - side, target, amount, 'physical', { what: what, onKill: onKill });
  }

  // One unit hitting one enemy: damage and kill bonuses.
  function strike(side, slot, u, dSide, target, amount, type, opts){
    opts = opts || {};
    var dp = state.players[dSide];
    var label = state.players[side].name + "'s " + u.card.name + (opts.what ? ' (' + opts.what + ')' : '');
    var tSlot = target.slot, victim = dp.units[tSlot];
    if (target.taunted) addLog('t' + state.tick + ': ' + dp.name + "'s " + victim.card.name + ' taunts — the attack has to go to it.', 'meta');
    fxAttack(side, slot, dSide, tSlot);
    var dealt = dealDamage(dSide, tSlot, amount, type, label);
    if (dp.units[tSlot] !== victim && opts.onKill) opts.onKill(victim);
    chargeStructures(side, 'attack');
    return dealt;
  }

  // Physical damage is reduced by armor, magic by MR, true damage by nothing:
  // taken = dmg × 100 / (100 + resist), rounded, at least 1.
  function mitigated(amount, type, side, slot){
    if (amount <= 0) return 0;
    var resist = type === 'physical' ? armorOf(side, slot) : type === 'magic' ? mrOf(side, slot) : 0;
    return Math.max(1, Math.round(amount * 100 / (100 + resist)));
  }
  // Returns the damage actually dealt.
  function dealDamage(side, slot, amount, type, label){
    var p = state.players[side], u = p.units[slot];
    var dealt = mitigated(amount, type, side, slot);
    u.hp -= dealt;
    if (dealt > 0) chargeStructures(side, 'damaged');
    fxFloat(side, slot, '−' + dealt, 'dmg');
    var note = dealt === amount ? '' : ' (' + amount + ' ' + type + ', ' + (type === 'physical' ? 'armor' : 'MR') + ' blocked ' + (amount - dealt) + ')';
    addLog('t' + state.tick + ': ' + label + ' hits ' + p.name + "'s " + u.card.name + ' for ' + dealt + note + '.', 'attack');
    if (u.hp <= 0) killUnit(side, slot);
    return dealt;
  }

  function killUnit(side, slot){
    var p = state.players[side], u = p.units[slot];
    if (!u) return;
    p.units[slot] = null;
    fxFloat(side, slot, 'DEFEATED', 'dmg');
    addLog('t' + state.tick + ': ' + p.name + "'s " + u.card.name + ' is destroyed.', 'destroy');
  }

  // Heals the weakest ally (lowest HP %). With an Overflow Clinic, healing past max HP raises max HP by the excess
  // (once per Clinic) for the round, so full-HP units are worth healing too.
  function healWeakest(side, u, amount, what){
    var p = state.players[side], clinics = structureCount(p, 'clinic'), best = -1, bestPct = Infinity;
    p.units.forEach(function(o, i){
      if (o && (clinics || o.hp < o.maxHp) && o.hp / o.maxHp < bestPct){ bestPct = o.hp / o.maxHp; best = i; }
    });
    if (best === -1){ say(side, u, 'has nothing to heal.', 'idle'); return; }
    var o = p.units[best], before = o.hp, over = Math.max(0, o.hp + amount - o.maxHp);
    o.hp = Math.min(o.maxHp, o.hp + amount);
    var healed = o.hp - before;
    if (healed) fxFloat(side, best, '+' + healed, 'heal');
    chargeStructures(side, 'heal');
    if (clinics && over){
      o.maxHp += over * clinics;
      o.hp += over;
      fxFloat(side, best, '+' + over * clinics + ' max HP', 'buff');
    }
    say(side, u, (what ? '(' + what + ') ' : '') + 'heals ' + o.card.name +
      (healed ? ' for ' + healed : '') +
      (clinics && over ? (healed ? ', and the' : ': the') + ' Overflow Clinic turns ' + over + ' overheal into +' + over * clinics + ' max HP (' + o.hp + '/' + o.maxHp + ')' : '') +
      '.', 'heal');
  }

  // ---------- Construction & structures ----------
  // p.structures holds one { key, charges } per built copy.
  function structureCount(p, key){ return p.structures.filter(function(s){ return s.key === key; }).length; }
  // Every copy whose gain event matches gets a charge.
  function chargeStructures(side, event){
    state.players[side].structures.forEach(function(s){ if (STRUCTURE_DEFS[s.key].gain === event) s.charges++; });
  }
  // Effects when a charged structure is activated; each returns a description for the log.
  var STRUCTURE_EFFECTS = {
    wardrum: function(p, side){
      p.units.forEach(function(a, i){ if (a){ a.roundAd = (a.roundAd || 0) + 2; fxFloat(side, i, '+2 AD', 'buff'); } });
      return 'all allies +2 AD';
    },
    shrine: function(p, side){
      p.units.forEach(function(a, i){ if (a){ a.maxHp += 5; a.hp += 5; fxFloat(side, i, '+5 max HP', 'buff'); } });
      return 'all allies +5 max HP';
    },
    bloodengine: function(p, side, slot){
      var a = p.units[slot];
      a.roundAd = (a.roundAd || 0) + 3;
      fxFloat(side, slot, '+3 AD', 'buff');
      return a.card.name + ' +3 AD (now ' + adOf(a) + ')';
    }
  };
  function canActivate(p, i){
    var s = p.structures[i], def = s && STRUCTURE_DEFS[s.key];
    return !!(def && def.spend) && (state.phase === 'setup' || state.phase === 'battle') && s.charges >= def.spend && p.units.some(Boolean);
  }
  // Clicking a built structure: activate it, or for a targeted one (Blood Engine) start picking an ally — clicking
  // it again cancels.
  function onStructureClick(side, i){
    var p = state.players[side], def = STRUCTURE_DEFS[p.structures[i].key];
    if (state.targeting && state.targeting.side === side && state.targeting.index === i){ state.targeting = null; render(); return; }
    if (!canActivate(p, i)) return;
    if (def.target === 'ally'){ state.targeting = { side: side, index: i }; render(); return; }
    activateStructure(side, i);
  }
  function activateStructure(side, i, slot){
    var p = state.players[side], s = p.structures[i], def = STRUCTURE_DEFS[s.key];
    state.targeting = null;
    if (!canActivate(p, i) || (def.target === 'ally' && !p.units[slot])){ render(); return; }
    s.charges -= def.spend;
    clearFx();
    var what = STRUCTURE_EFFECTS[s.key](p, side, slot);
    addLog((state.phase === 'battle' ? 't' + state.tick + ': ' : '') + p.name + ' activates ' + def.name + ' (−' + def.spend + ' charges, ' + s.charges + ' left): ' + what + '.', 'heal');
    state.inspected = { structure: s.key, side: side, index: i };
    render();
    playEvents();
  }
  function build(side, key){
    var p = state.players[side], def = STRUCTURE_DEFS[key];
    if (state.phase !== 'setup' || p.con < def.cost) return;
    p.con -= def.cost;
    p.structures.push({ key: key, charges: 0 });
    addLog(p.name + ' builds ' + def.name + ' (' + p.con + ' construction left).', 'heal');
    render();
  }

  // ---------- Rounds ----------
  // Wiping out every enemy unit wins the round. Time running out, or both sides wiped at once, is a tie.
  // There is no match limit: rounds just keep going and the score keeps counting.
  function livingUnits(p){ return p.units.filter(Boolean).length; }
  function checkForWipe(){
    if (state.phase !== 'battle') return false;
    var alive = state.players.map(livingUnits);
    if (alive[0] && alive[1]) return false;
    endRound(alive[0] ? 0 : alive[1] ? 1 : null, 'both sides were wiped out');
    return true;
  }
  function endRound(winner, tieReason){
    stopClock();
    state.queue = [];
    if (winner === null){
      addLog('Round ' + state.round + ' is a tie — ' + tieReason + '.', 'win');
    } else {
      state.roundWins[winner]++;
      addLog(state.players[1 - winner].name + ' has no units left — ' + state.players[winner].name + ' wins round ' + state.round +
        '. Score ' + state.roundWins[0] + '–' + state.roundWins[1] + '.', 'win');
    }
    state.phase = 'roundEnd';
    render();
  }
  // Every round is a fresh fight: the cards that were fielded (alive or dead) go to the discard pile, the bench is
  // shuffled back into the deck, and a new hand is drawn and placed.
  function nextRound(){
    if (state.phase !== 'roundEnd') return;
    state.players.forEach(function(p){
      var fielded = p.hand.filter(function(c){ return onBoard(p, c) || state.fielded.indexOf(c) !== -1; });
      p.discard = p.discard.concat(fielded);
      p.deck = shuffle(p.deck.concat(p.hand.filter(function(c){ return fielded.indexOf(c) === -1; })));
      p.hand = [];
      p.units = new Array(UNIT_SLOTS).fill(null);
    });
    state.targeting = null;
    state.round++;
    state.tick = 0;
    state.spotlight = null;
    clearFx();
    state.phase = 'setup';
    state.inspected = null;
    addLog('Round ' + state.round + ': fielded units go to the discard pile, the bench is shuffled back, and each player draws ' + HAND_SIZE + '.', 'meta');
    dealUnits();
    logTurnOrder();
    render();
  }

  // ---------- Rendering ----------
  var PHASE_LABEL = { setup: 'Setup', battle: 'Battle', roundEnd: 'Round over' };

  // The tile's headline: the ability the unit uses this round — a button that cycles through the abilities it
  // can use from this slot, whenever switching is allowed (and there is more than one).
  function roleLine(card, u, slot){
    if (!u.ability){
      var only = card.abilities.map(function(a){ return a.name + ' (' + slotRestriction(a) + ')'; }).join(', ');
      return '<div class="line" title="No ability can be used from this slot: ' + only + '">NO ABILITY</div>';
    }
    var ab = findAbility(card, u.ability);
    var tip = ab.name + ': ' + ab.text;
    if (canSwitchAbility() && allowedAbilities(card, slot).length > 1)
      return '<button class="ability-btn" type="button" title="' + tip + ' — click to switch ability' +
        (state.phase === 'battle' ? ' (pauses the battle and resets its charge)' : '') + '">' + ab.short + ' ⇄</button>';
    return '<div class="line hot" title="' + tip + '">' + ab.short + '</div>';
  }

  function prioBadge(side, slot){
    var n = priority(side, slot);
    return '<div class="prio mono" title="Turn order #' + n + ' — lower acts first on the same tick">#' + n + '</div>';
  }

  function signed(n){ return (n > 0 ? '+' : '−') + Math.abs(n); }
  // Permanent stat changes a card has picked up in play (Medic's AD buff, Predator trophies); losses show negative.
  function permanentBonuses(card){
    return [['bonusHp', 'HP', 'HP'], ['bonusAd', 'AD', 'AD'], ['bonusAp', 'AP', 'AP'], ['bonusArmor', 'ARM', 'armor'], ['bonusMr', 'MR', 'MR']]
      .filter(function(f){ return card[f[0]]; })
      .map(function(f){ return { amount: card[f[0]], short: f[1], long: f[2] }; });
  }

  // Temporary states worth seeing at a glance.
  function statusLine(u){
    var tags = [];
    if (u.delayed) tags.push('DELAYED +' + u.delayed);
    if (u.jammed) tags.push('JAMMED');
    if (u.roundAd) tags.push('+' + u.roundAd + ' AD this round');
    permanentBonuses(u.card).forEach(function(b){ tags.push(signed(b.amount) + ' ' + b.short); });
    return tags.length ? '<div class="line status">' + tags.join(' · ') + '</div>' : '';
  }

  function renderUnit(side, slot, next){
    var p = state.players[side], u = p.units[slot];
    if (!u){
      var empty = el('div', 'slot-empty', { 'data-unit': side + '-' + slot });
      empty.innerHTML = prioBadge(side, slot);
      return empty;
    }
    var card = u.card;
    var isNext = !!(next && next.side === side && next.slot === slot);
    var hpPct = Math.max(0, u.hp / u.maxHp);
    var cd = cooldownOf(side, slot);
    var cdPct = state.phase === 'battle' ? chargeShown(side, slot, state.tick) : 0;
    var arm = armorOf(side, slot), mr = mrOf(side, slot);
    var buffed = arm !== card.armor || cd !== card.cooldown;
    var targetable = !!(state.targeting && state.targeting.side === side);
    var tile = el('div', 'tile r-' + card.role + (isNext && !clock ? ' next' : '') + (targetable ? ' targetable' : ''), {
      'data-unit': side + '-' + slot, tabindex: '0', role: 'button', title: card.name
    });
    tile.innerHTML = prioBadge(side, slot) + (isNext ? '<div class="next-tag">NEXT</div>' : '') +
      '<div class="icon">' + card.icon + '</div><div class="name">' + card.name + '</div>' + roleLine(card, u, slot) + statusLine(u) +
      '<div class="line mono' + (buffed ? ' buff' : '') + '" title="Armor and magic resist, including buffs this round">ARM ' + arm + ' · MR ' + mr + '</div>' +
      '<div class="line mono">' + u.hp + '/' + u.maxHp + ' HP</div>' +
      '<div class="bar hp' + (hpPct < .34 ? ' low' : '') + '"><div style="width:' + (hpPct * 100) + '%"></div></div>' +
      '<div class="bar cd" title="Charge — acts when full"><div data-charge="' + side + '-' + slot + '" style="width:' + (cdPct * 100) + '%"></div></div>';
    tile.addEventListener('click', function(){ onSlotClick(side, slot); });
    hoverInspect(tile, function(){ var cur = state.players[side].units[slot]; return cur && { card: cur.card, side: side, slot: slot }; });
    var abBtn = tile.querySelector('.ability-btn');
    if (abBtn) abBtn.addEventListener('click', function(e){ e.stopPropagation(); cycleAbility(side, slot); });
    return tile;
  }

  var STAT_COLS = ['HP', 'AD', 'AP', 'ARM', 'MR', 'AS', 'CON'];
  // The stat each role cares about most is highlighted: damage for attackers, heal power for healers.
  var KEY_STAT = { attacker: 'AD', healer: 'AP' };
  function statCells(card){
    var vals = { HP: card.hp + (card.bonusHp || 0), AD: card.ad + (card.bonusAd || 0), AP: card.ap + (card.bonusAp || 0), ARM: card.armor + (card.bonusArmor || 0), MR: card.mr + (card.bonusMr || 0), AS: card.as, CON: card.con };
    return STAT_COLS.map(function(k){
      var v = vals[k];
      var text = k === 'AS' ? (v > 0 ? v.toFixed(2) : '—') : v;
      var cls = 'num mono' + (!v ? ' zero' : '') + (KEY_STAT[card.role] === k ? ' key' : '');
      return '<span class="' + cls + '">' + text + '</span>';
    }).join('');
  }
  function statHeader(){
    var head = el('div', 'deck-cols mono', { 'aria-hidden': 'true' });
    head.innerHTML = '<span></span><span></span><span></span>' + STAT_COLS.map(function(k){ return '<span>' + k + '</span>'; }).join('');
    return head;
  }

  // The drawn hand: each card shows where it was placed, or that it is on the bench this round.
  function renderHandRow(side, card){
    var p = state.players[side];
    var slot = p.units.findIndex(function(u){ return u && u.card === card; });
    var row = el('div', 'deck-row r-' + card.role + (slot === -1 ? ' benched' : ''), { tabindex: '0', title: card.name });
    var where = slot !== -1 ? SLOT_NAMES[slot].toUpperCase() + ' #' + priority(side, slot) : 'BENCH';
    row.innerHTML = '<span class="pos mono"></span><span>' + card.icon + '</span>' +
      '<span class="nm">' + card.name + '<small>' + where + '</small></span>' + statCells(card);
    hoverInspect(row, function(){ return slot !== -1 ? { card: card, side: side, slot: slot } : { card: card, side: side }; });
    return row;
  }

  // Construction pool, built structures (each a button showing its charges), and in setup a Build button per
  // structure. Hovering any of them shows the structure in Card Info.
  function renderStructures(side, panel){
    var p = state.players[side];
    var sec = panel.appendChild(el('div', 'structures', {}));
    sec.innerHTML = '<div class="row-label">Construction <b class="mono">' + p.con + '</b></div>';
    var builtRow = sec.appendChild(el('div', 'structure-row', {}));
    if (!p.structures.length) builtRow.appendChild(el('span', 'empty-note', {})).textContent = 'No structures built.';
    p.structures.forEach(function(s, i){
      var def = STRUCTURE_DEFS[s.key];
      // wrapped, because disabled buttons don't get hover events in every browser
      var wrap = builtRow.appendChild(el('span', '', {}));
      hoverInspect(wrap, function(){ return { structure: s.key, side: side, index: i }; });
      if (!def.spend){
        wrap.appendChild(el('span', 'pill structure-pill', {})).textContent = def.icon + ' ' + def.name + ' · always on';
        return;
      }
      var picking = state.targeting && state.targeting.side === side && state.targeting.index === i;
      var ready = canActivate(p, i);
      var b = wrap.appendChild(el('button', 'btn small structure-btn' + (picking ? ' picking' : ready ? ' ready' : ''), { type: 'button' }));
      b.textContent = picking ? def.icon + ' ' + def.name + ' — pick an ally (click to cancel)'
        : def.icon + ' ' + def.name + ' · ' + Math.min(s.charges, 99) + '/' + def.spend;
      b.disabled = !picking && !ready;
      b.addEventListener('click', function(){ onStructureClick(side, i); });
    });
    if (state.phase !== 'setup') return;
    var row = sec.appendChild(el('div', 'structure-row', {}));
    Object.keys(STRUCTURE_DEFS).forEach(function(k){
      var def = STRUCTURE_DEFS[k];
      var wrap = row.appendChild(el('span', '', {}));
      var b = wrap.appendChild(el('button', 'btn small', { type: 'button' }));
      b.textContent = 'Build ' + def.icon + ' ' + def.name + ' · ' + def.cost;
      b.disabled = p.con < def.cost;
      b.addEventListener('click', function(){ build(side, k); });
      hoverInspect(wrap, function(){ return { structure: k, side: side }; });
    });
  }

  // Card Info for a structure: its description, build cost, and — for a built copy — its charges.
  function structureInfoHtml(key, p, index){
    var def = STRUCTURE_DEFS[key], n = structureCount(p, key), s = index != null ? p.structures[index] : null;
    var pills = ['Build ' + def.cost];
    if (def.spend) pills.push(s ? 'Charges ' + s.charges + '/' + def.spend : 'Needs ' + def.spend + ' charges');
    else pills.push('Always on');
    pills.push(n ? 'Owned ×' + n : 'Not built');
    var footer = s && def.spend
      ? (s.charges >= def.spend ? 'Ready: click it to spend ' + def.spend + ' charges' + (def.target === 'ally' ? ', then click the ally to boost' : '') + '.'
                                : (def.spend - s.charges) + ' more charge' + (def.spend - s.charges === 1 ? '' : 's') + ' until it can be activated.')
      : 'Construction pool ' + p.con + (n > 1 ? ' · each copy charges and activates on its own' : '');
    return '<div class="inspector-title"><div class="inspector-icon">' + def.icon + '</div>' +
      '<div><div class="inspector-name">' + def.name + '</div><div class="inspector-role">Structure</div></div></div>' +
      '<div class="inspector-stats">' + pills.map(function(t){ return '<span class="stat-pill mono">' + t + '</span>'; }).join('') + '</div>' +
      '<div class="inspector-effect">' + def.text + '</div>' +
      '<div class="inspector-live">' + footer + '</div>';
  }

  function renderPanel(side, next){
    var p = state.players[side];
    var panel = document.getElementById('panel-' + side);
    panel.innerHTML =
      '<div class="panel-head"><div class="panel-title">' + p.name + '</div>' +
      '<span class="pill mono" title="Cards left in your deck (drawn at random)">Deck ' + p.deck.length + '</span>' +
      '<span class="pill mono" title="Cards in the discard pile">Discard ' + p.discard.length + '</span></div>';
    var unitsSec = panel.appendChild(el('div', '', {}));
    // Slots are drawn facing the middle of the screen: the left player's run Back · Middle · Front, the right
    // player's Front · Middle · Back. Only the drawing order changes; slot 0 is always the front.
    var drawOrder = SLOT_NAMES.map(function(_, slot){ return slot; });
    if (side === 0) drawOrder.reverse();
    var slotNames = unitsSec.appendChild(el('div', 'slot-names', {}));
    drawOrder.forEach(function(slot){ slotNames.appendChild(el('div', 'row-label', {})).textContent = SLOT_NAMES[slot]; });
    var unitsRow = unitsSec.appendChild(el('div', 'row units-row', {}));
    drawOrder.forEach(function(slot){ unitsRow.appendChild(renderUnit(side, slot, next)); });

    renderStructures(side, panel);

    var deckSec = panel.appendChild(el('div', 'deck-section', {}));
    var picksWrap = deckSec.appendChild(el('div', '', {}));
    picksWrap.appendChild(el('div', 'row-label', {})).textContent = 'Your hand — ' + p.hand.length + ' drawn, ' + UNIT_SLOTS + ' placed by preferred position';
    var picks = picksWrap.appendChild(el('div', 'deck-list', {}));
    picks.appendChild(statHeader());
    p.hand.forEach(function(card){ picks.appendChild(renderHandRow(side, card)); });
  }

  // Hovering (or focusing) a card shows it in Card Info. Only the Card Info panel is redrawn, so the board
  // under the cursor stays put; the last card hovered stays shown after the pointer moves on.
  function hoverInspect(elem, getInfo){
    var show = function(){
      var info = getInfo(), cur = state.inspected;
      if (!info || (cur && cur.card === info.card && cur.structure === info.structure && cur.index === info.index && cur.side === info.side && cur.slot === info.slot)) return;
      state.inspected = info;
      renderInspector();
    };
    elem.addEventListener('mouseenter', show);
    elem.addEventListener('focusin', show);
  }

  function renderInspector(){
    var box = document.getElementById('inspector');
    var body = document.getElementById('inspectorBody');
    var ins = state.inspected;
    if (!ins){
      box.className = 'inspector';
      body.innerHTML = '<div class="inspector-empty">Click any card to see its stats.</div>';
      return;
    }
    if (ins.structure){
      box.className = 'inspector r-support';
      body.innerHTML = structureInfoHtml(ins.structure, state.players[ins.side], ins.index);
      return;
    }
    box.className = 'inspector r-' + ins.card.role;
    var u = ins.slot != null ? state.players[ins.side].units[ins.slot] : null;
    var onBoard = !!(u && u.card === ins.card);
    var pickable = onBoard && canSwitchAbility() && allowedAbilities(ins.card, ins.slot).length > 1;
    var html = cardInfoHtml(ins.card, onBoard ? u.ability : undefined, pickable, onBoard ? ins.slot : undefined);
    if (pickable && state.phase === 'battle') html += '<div class="inspector-live">Click an ability to switch — this pauses the battle and resets its charge.</div>';
    if (u && u.card === ins.card){
      var live = ['On ' + state.players[ins.side].name + "'s board", SLOT_NAMES[ins.slot] + ' slot', 'Turn order #' + priority(ins.side, ins.slot), 'HP ' + u.hp + '/' + u.maxHp,
                  'ARM ' + armorOf(ins.side, ins.slot) + ' · MR ' + mrOf(ins.side, ins.slot)];
      if (u.delayed) live.push('Delayed ' + u.delayed + ' ticks by a Saboteur');
      if (u.jammed) live.push('Jammed: its next ability does nothing');
      permanentBonuses(ins.card).forEach(function(b){ live.push('Permanent: ' + signed(b.amount) + ' ' + b.long + ' for the game'); });
      var icd = cooldownOf(ins.side, ins.slot);
      live.push(isFinite(icd) ? 'Acts every ' + icd + ' ticks' : u.ability ? 'Passive — never acts' : 'Does not act on its own in this slot');
      html += '<div class="inspector-live">' + live.join(' · ') + '</div>';
    }
    body.innerHTML = html;
    body.querySelectorAll('[data-ability]').forEach(function(item){
      var pick = function(){ setAbility(ins.side, ins.slot, item.getAttribute('data-ability')); };
      item.addEventListener('click', pick);
      item.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); pick(); } });
    });
  }

  function renderLog(){
    var body = document.getElementById('logBody');
    body.innerHTML = '';
    state.log.forEach(function(entry){ body.appendChild(el('div', 'log-line ' + entry.type, {})).textContent = entry.text; });
    body.scrollTop = body.scrollHeight;
  }

  function renderHeader(next){
    document.getElementById('roundLabel').textContent = state.round;
    document.getElementById('scoreLabel').textContent = state.roundWins[0] + ' – ' + state.roundWins[1];
    document.getElementById('phaseLabel').textContent = PHASE_LABEL[state.phase];
    document.getElementById('tickPill').hidden = state.phase === 'setup';
    document.getElementById('tickLabel').textContent = state.tick;
    document.getElementById('tickMax').textContent = SIM_TICKS;
    document.getElementById('roundProgress').hidden = state.phase === 'setup';
    document.getElementById('roundFill').style.width = (state.tick / SIM_TICKS * 100) + '%';
    document.getElementById('nextPill').hidden = !next;
    if (next) document.getElementById('nextLabel').textContent = state.players[next.side].name + "'s " + state.players[next.side].units[next.slot].card.name + ' @ t' + next.tick;
    var main = document.getElementById('mainBtn');
    main.textContent = state.phase === 'setup' ? 'Start battle' : state.phase === 'battle' ? (clock ? 'Pause ❚❚' : 'Resume ▶') : 'Next round';
  }

  function renderAction(){
    var panel = document.getElementById('actionPanel');
    var body = document.getElementById('actionBody');
    var sp = state.spotlight;
    panel.className = 'action-panel' + (sp && sp.side != null ? ' p' + (sp.side + 1) : '');
    if (state.phase === 'setup'){ body.innerHTML = '<div class="action-wait">Your units were placed by preferred position. Switch abilities if you like (⇄ on the card, or in Card Info), then start the battle.</div>'; return; }
    body.innerHTML = '';
    if (!sp){ body.innerHTML = '<div class="action-wait">' + (clock ? 'Simming…' : 'Paused.') + '</div>'; return; }
    body.appendChild(el('div', 'action-title', {})).textContent = sp.title;
    state.log.forEach(function(entry){
      if (entry.seq >= sp.fromSeq) body.appendChild(el('div', 'action-line ' + entry.type, {})).textContent = entry.text.replace(/^t\d+: /, '');
    });
  }

  function render(){
    var next = peekNextAction();
    renderAction();
    renderHeader(next);
    renderPanel(0, next);
    renderPanel(1, next);
    renderInspector();
    renderLog();
  }

  document.getElementById('mainBtn').addEventListener('click', function(){
    if (state.phase === 'setup') startBattle();
    else if (state.phase === 'battle') togglePause();
    else nextRound();
  });
  document.getElementById('resetBtn').addEventListener('click', newGame);
  // Space works the main button (start / pause / resume / next round), unless a control has focus. Esc cancels
  // picking a target for a structure.
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && state.targeting){ state.targeting = null; render(); return; }
    if (e.key !== ' ' || e.target.closest('button, a, [role="button"], input, select, textarea')) return;
    e.preventDefault();
    document.getElementById('mainBtn').click();
  });

  newGame();
})();
</script>
</body>
</html>
